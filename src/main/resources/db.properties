# Configuração padrão do banco de dados (MySQL 8).
#
# Cada chave pode ser sobrescrita, nesta ordem de prioridade:
#   1. propriedade de sistema da JVM:  -Dcatalogo.db.senha=minhaSenha
#   2. variável de ambiente:           CATALOGO_DB_SENHA=minhaSenha
#   3. este arquivo
# Em produção, prefira as opções 1 ou 2 para não gravar a senha no código.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/catalogo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
db.usuario=catalogo_app
db.senha=catalogo123

# Scripts executados na inicialização (separados por vírgula). O schema usa
# CREATE TABLE IF NOT EXISTS, então pode ser executado mais de uma vez.
db.scripts=db/schema.sql

