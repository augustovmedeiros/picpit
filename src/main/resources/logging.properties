# Configuração de log da aplicação (java.util.logging).
#
# O Tomcat (JULI) carrega automaticamente este arquivo de WEB-INF/classes e grava
# os logs da aplicação em $CATALINA_BASE/logs/catalogo.AAAA-MM-DD.log.
# Os detalhes técnicos (SQLState, stack traces, protocolo do erro) ficam apenas
# no log; o usuário vê somente mensagens amigáveis.

handlers = 1catalogo.org.apache.juli.AsyncFileHandler, java.util.logging.ConsoleHandler

1catalogo.org.apache.juli.AsyncFileHandler.level = FINE
1catalogo.org.apache.juli.AsyncFileHandler.directory = ${catalina.base}/logs
1catalogo.org.apache.juli.AsyncFileHandler.prefix = catalogo.
1catalogo.org.apache.juli.AsyncFileHandler.encoding = UTF-8
1catalogo.org.apache.juli.AsyncFileHandler.maxDays = 30

java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.encoding = UTF-8

br.com.catalogo.level = FINE

